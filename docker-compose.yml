version: '3.8'

services:
  pattern-guard:
    build: .
    container_name: pattern-guard-prosecutor
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional: Provide default keys if desired (or leave blank for Python local engine)
      - GROK_API_KEY=${GROK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped

